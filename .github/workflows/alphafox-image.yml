name: AlphaFox image

# 发布 alphafoxai/gpt-load 的 linux/amd64 镜像。主机不编译：
# 打 tag v2.0.0-rc.*-af.* 后，本 workflow 推
# ghcr.io/alphafoxai/gpt-load:<version> 和浮动 tag :2。
# CPA 上的 auto-update.sh 只跟随 :2。
# 上游的 release.yml 面向 ghcr.io/tbphp/gpt-load，已在本 fork 停用。

on:
  push:
    tags:
      - "v2.0.0-rc.*-af.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 git ref。手动构建只推版本 tag，不移动浮动 tag :2。"
        required: true
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: alphafox-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alphafoxai/gpt-load

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$(git describe --tags --always)"
            move_floating=false
          else
            version="${GITHUB_REF_NAME#v}"
            move_floating=true
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'move_floating=%s\n' "$move_floating" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: source-build
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}

      - name: Move the floating tag
        if: steps.version.outputs.move_floating == 'true'
        shell: bash
        run: |
          set -eu
          digest="$(docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}" --format '{{.Manifest.Digest}}")"
          docker buildx imagetools create -t "${IMAGE}:2" "${IMAGE}@${digest}"
